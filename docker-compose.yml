version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogo_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Configure DATABASE_URL no .env}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:?Configure ADMIN_SESSION_SECRET no .env}
      - API_ADMIN_KEY=${API_ADMIN_KEY:?Configure API_ADMIN_KEY no .env}
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: catalogo_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no .env}
    ports:
      - "5432:5432"
    volumes:
      - catalogo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  catalogo_postgres_data:
